name: CotaniQuickStart
version: '0.1.0'
main: com.example.cotaniquickstart.CotaniQuickStartPlugin
description: Minimal compile-checked Cotani example
api-version: '26.1'
folia-supported: true
commands:
  cotanihello:
    description: Confirms that Cotani is running
    usage: /cotanihello
  cotanieco:
    description: Economy demo command
    usage: /cotanieco
  cotanispawn:
    description: Teleport demo command
    usage: /cotanispawn
  cotanirecycler:
    description: Recycler GUI demo command
    usage: /cotanirecycler
