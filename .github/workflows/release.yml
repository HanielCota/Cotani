name: Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Verify Docker for Integration Tests
        run: docker info

      - name: Verify Tag Matches Project Version
        shell: bash
        run: |
          project_version="$(./gradlew properties -q | sed -n 's/^version: //p')"
          if [[ "$project_version" == *-SNAPSHOT ]]; then
            echo "Refusing to release snapshot version: $project_version" >&2
            exit 1
          fi
          clean_tag="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$clean_tag" && "$project_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Gradle version $project_version" >&2
            exit 1
          fi

      - name: Build, Check & Publish Locally
        run: ./gradlew clean build integrationTest publishToMavenLocal

      - name: Publish Modules to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: bash
        run: find cotani-*/build/libs -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            cotani-*/build/libs/*.jar
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
